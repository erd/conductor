[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/erd/conductor"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
schemars = { version = "1.2", features = ["jiff02"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The hook shim runs this binary on every Claude Code hook, so keep it small and fast.
[profile.release]
lto = true
codegen-units = 1
strip = true
