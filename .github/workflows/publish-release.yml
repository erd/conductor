name: Publish Release

# When a release PR from release.yml merges, tags the merge commit v<version> and creates the
# GitHub release with its changelog. Any other push to main is a no-op (release_always = false).

on:
  push:
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
